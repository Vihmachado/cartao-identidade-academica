<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir {{ aluno.nome }} · Data_Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-2: #475569; --text-3: #64748b;
            --line: #e2e8f0; --red: #ef4444; --red-2: #dc2626;
            --radius-card: 20px; --mono: "JetBrains Mono", monospace; --ui: "Inter", system-ui, sans-serif;
            --shadow-card: 0 12px 34px rgba(15,23,42,.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: var(--ui); display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 32px; text-align: center;
        }
        .icon {
            width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center;
            background: #fef2f2; color: var(--red); font-size: 26px;
        }
        .kicker { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
        h1 { margin: 8px 0 10px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
        p { color: var(--text-2); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        p strong { color: var(--text); }
        .actions { display: flex; gap: 10px; justify-content: center; }
        button, .btn-ghost {
            font-family: var(--ui); font-weight: 700; font-size: 14px; padding: 11px 22px;
            border-radius: 999px; border: none; cursor: pointer; text-decoration: none;
        }
        button[type="submit"] { background: var(--red); color: #fff; }
        button[type="submit"]:hover { background: var(--red-2); }
        .btn-ghost { background: #f1f5f9; color: var(--text); }
        .btn-ghost:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🗑️</div>
        <div class="kicker">DATA_CORE // ALUNOS</div>
        <h1>Excluir aluno?</h1>
        <p>Tem certeza que deseja excluir <strong>{{ aluno.nome }}</strong>? Essa ação não pode ser desfeita.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button type="submit">Sim, excluir</button>
                <a class="btn-ghost" href="{% url 'listar_alunos' %}">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
