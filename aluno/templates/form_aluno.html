{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} · Data_Core</title>
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-2: #475569; --text-3: #64748b;
            --line: #e2e8f0; --blue: #2563eb; --blue-2: #3b82f6; --purple: #7c3aed;
            --radius-card: 20px; --radius-md: 12px;
            --mono: "JetBrains Mono", monospace; --ui: "Inter", system-ui, sans-serif;
            --shadow-card: 0 12px 34px rgba(15,23,42,.06);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: var(--ui); display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: min(620px, 100%); background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 32px;
        }
        .kicker { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); }
        h1 { margin: 6px 0 24px; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--text); }
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius-md);
            font-family: var(--ui); font-size: 14px; color: var(--text); margin-bottom: 18px; background: #fff;
            height: 44px; appearance: none;
        }
        textarea { height: auto; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
        textarea { resize: vertical; min-height: 110px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .check-row {
            display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 14px;
            border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: 18px; background: #fff;
        }
        .check-row input { width: 16px; height: 16px; margin: 0; accent-color: var(--blue); }
        .check-row label { margin: 0; font-weight: 500; }
        .actions { display: flex; gap: 10px; margin-top: 8px; }
        button, .btn-ghost {
            font-family: var(--ui); font-weight: 700; font-size: 14px; padding: 11px 20px;
            border-radius: 999px; border: none; cursor: pointer; text-decoration: none; text-align: center;
        }
        button[type="submit"] { background: var(--blue); color: #fff; }
        button[type="submit"]:hover { background: var(--blue-2); }
        .btn-ghost { background: #f1f5f9; color: var(--text); }
        .btn-ghost:hover { background: #e2e8f0; }
        @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="kicker">DATA_CORE // ALUNOS</div>
        <h1>{{ titulo }}</h1>
        <form method="post">
            {% csrf_token %}
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ aluno.nome|default:'' }}" required>

            <div class="grid-2">
                <div>
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" name="matricula" value="{{ aluno.matricula|default:'' }}">
                </div>
                <div>
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" value="{{ aluno.email|default:'' }}">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="curso">Curso</label>
                    <input type="text" id="curso" name="curso" value="{{ aluno.curso|default:'' }}" required>
                </div>
                <div>
                    <label for="semestre">Semestre</label>
                    <input type="number" id="semestre" name="semestre" min="1" max="20" value="{{ aluno.semestre|default:'1' }}" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" value="{{ aluno.cpf|default:'' }}">
                </div>
                <div>
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" value="{{ aluno.data_nascimento|date:'Y-m-d'|default:'' }}">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        {% for valor, rotulo in status_choices %}
                        <option value="{{ valor }}" {% if aluno.status == valor %}selected{% endif %}>{{ rotulo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Bolsista</label>
                    <div class="check-row">
                        <input type="checkbox" id="bolsista" name="bolsista" {% if aluno.bolsista %}checked{% endif %}>
                        <label for="bolsista">Aluno bolsista</label>
                    </div>
                </div>
            </div>

            <label for="bio">Bio</label>
            <textarea id="bio" name="bio">{{ aluno.bio|default:'' }}</textarea>

            <div class="actions">
                <a class="btn-ghost" href="{% url 'listar_alunos' %}">Cancelar</a>
                <button type="submit">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
